<!DOCTYPE html>

<header>
  <h1>Green Future</h1>

  <nav>
    <a href="index.html">About Us</a>

    <a href="contact.html" class="current">Contact</a>
  </nav>

<main>
  <h2>Contact Us</h2>

  <div class="contact">
    <form action="#">
      <label for="name">Full Name</label><br>
      <input type="text" id="name" name="name" placeholder="Your name..."><br><br>

      <label for="email">Email</label><br>
      <input type="email" id="email" name="email" placeholder="Your email..."><br><br>

      <label for="message">Message</label><br>
      <textarea id="message" name="message" rows="6" placeholder="Write your message..."></textarea><br><br>

      <input type="submit" value="Submit">
    </form>
  </div>
</main>

<footer>
  <p>Green Future 2026</p>
</footer>
